      - name: Create signing keystore
        run: |
          echo '' | base64 -d > project/ringer.keystore
          ls -la project/ringer.keystore

      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Build debug APK
        working-directory: project
        run: |
          ../gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RingerToggle-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
