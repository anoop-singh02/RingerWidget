          cat > 'app/src/main/java/com/anoop/ringerwidget/Widgets.kt' << 'FILE_EOF_MARKER'
          package com.anoop.ringerwidget

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager

          abstract class BaseRingerWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  RingerCore.updateAllWidgets(context)
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  when (intent.action) {
                      RingerCore.ACTION_TOGGLE -> {
                          RingerCore.cycleMode(context)
                          RingerCore.updateAllWidgets(context)
                      }
                      AudioManager.RINGER_MODE_CHANGED_ACTION,
                      Intent.ACTION_SCREEN_ON,
                      Intent.ACTION_USER_PRESENT,
                      "android.media.STREAM_MUTE_CHANGED_ACTION" -> {
                          RingerCore.updateAllWidgets(context)
                      }
                  }
              }
          }

          class WidgetSquare : BaseRingerWidget()
          class WidgetPill : BaseRingerWidget()
          class WidgetCircle : BaseRingerWidget()
