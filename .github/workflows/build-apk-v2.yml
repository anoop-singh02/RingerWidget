name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project files
        run: |
          set -e
          mkdir -p project
          cd project
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' << 'FILE_EOF_MARKER'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.anoop.ringerwidget"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.anoop.ringerwidget"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }

              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file("ringer.keystore")
                      storePassword = "ringer123"
                      keyAlias = "ringer"
                      keyPassword = "ringer123"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          FILE_EOF_MARKER
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' << 'FILE_EOF_MARKER'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />

              <application
                  android:name=".RingerApp"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.RingerWidget"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".RingerWidgetProvider"
                      android:exported="true"
                      android:label="@string/widget_name_square">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.anoop.ringerwidget.TOGGLE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/ringer_widget_info" />
                  </receiver>

                  <receiver
                      android:name=".RingerWidgetCircleProvider"
                      android:exported="true"
                      android:label="@string/widget_name_circle">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.anoop.ringerwidget.TOGGLE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/ringer_widget_circle_info" />
                  </receiver>

                  <receiver
                      android:name=".RingerWidgetPillProvider"
                      android:exported="true"
                      android:label="@string/widget_name_pill">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.anoop.ringerwidget.TOGGLE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/ringer_widget_pill_info" />
                  </receiver>

              </application>
          </manifest>
          FILE_EOF_MARKER
          mkdir -p 'app/src/main/java/com/anoop/ringerwidget'
          cat > 'app/src/main/java/com/anoop/ringerwidget/MainActivity.kt' << 'FILE_EOF_MARKER'
          package com.anoop.ringerwidget

          import android.app.NotificationManager
          import android.content.Intent
          import android.media.AudioManager
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var statusText: TextView
              private lateinit var toggleButton: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  statusText = findViewById(R.id.status_text)
                  toggleButton = findViewById(R.id.toggle_button)

                  toggleButton.setOnClickListener {
                      val nm = getSystemService(NotificationManager::class.java)
                      if (!nm.isNotificationPolicyAccessGranted) {
                          startActivity(Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS))
                      } else {
                          WidgetCore.cycleMode(this)
                          refresh()
                          WidgetCore.updateAll(this)
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
                  WidgetCore.updateAll(this)
              }

              private fun refresh() {
                  val nm = getSystemService(NotificationManager::class.java)
                  if (!nm.isNotificationPolicyAccessGranted) {
                      statusText.text = getString(R.string.perm_needed)
                      toggleButton.text = getString(R.string.btn_grant)
                      return
                  }
                  val audio = getSystemService(AUDIO_SERVICE) as AudioManager
                  statusText.text = when (audio.ringerMode) {
                      AudioManager.RINGER_MODE_NORMAL -> getString(R.string.status_ring)
                      AudioManager.RINGER_MODE_VIBRATE -> getString(R.string.status_vibrate)
                      else -> getString(R.string.status_mute)
                  }
                  toggleButton.text = getString(R.string.btn_cycle)
              }
          }
          FILE_EOF_MARKER
          mkdir -p 'app/src/main/java/com/anoop/ringerwidget'
          cat > 'app/src/main/java/com/anoop/ringerwidget/RingerApp.kt' << 'FILE_EOF_MARKER'
          package com.anoop.ringerwidget

          import android.app.Application
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.media.AudioManager
          import androidx.core.content.ContextCompat

          class RingerApp : Application() {

              private val syncReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      WidgetCore.updateAll(context)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  val filter = IntentFilter().apply {
                      addAction(AudioManager.RINGER_MODE_CHANGED_ACTION)
                      addAction(Intent.ACTION_SCREEN_ON)
                      addAction(Intent.ACTION_USER_PRESENT)
                  }
                  ContextCompat.registerReceiver(this, syncReceiver, filter, ContextCompat.RECEIVER_EXPORTED)
                  WidgetCore.updateAll(this)
              }
          }
          FILE_EOF_MARKER
          mkdir -p 'app/src/main/java/com/anoop/ringerwidget'
          cat > 'app/src/main/java/com/anoop/ringerwidget/RingerCore.kt' << 'FILE_EOF_MARKER'
          package com.anoop.ringerwidget

          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.widget.RemoteViews

          /**
           * Shared logic for all widget styles.
           *
           * MUTE strategy: instead of setRingerMode(SILENT) — which Android force-couples
           * to Do Not Disturb for third-party apps — we mute the RING and NOTIFICATION
           * streams directly. This is the same path the system volume panel takes, so
           * DND stays untouched: true Pixel-style Mute.
           */
          object RingerCore {

              const val ACTION_TOGGLE = "com.anoop.ringerwidget.TOGGLE"

              enum class Mode { RING, VIBRATE, MUTE }

              fun currentMode(context: Context): Mode {
                  val audio = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  return when {
                      audio.ringerMode == AudioManager.RINGER_MODE_VIBRATE -> Mode.VIBRATE
                      audio.ringerMode == AudioManager.RINGER_MODE_SILENT -> Mode.MUTE
                      audio.isStreamMute(AudioManager.STREAM_RING) -> Mode.MUTE
                      else -> Mode.RING
                  }
              }

              fun cycleMode(context: Context) {
                  val audio = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (!nm.isNotificationPolicyAccessGranted) return

                  when (currentMode(context)) {
                      Mode.RING -> {
                          audio.ringerMode = AudioManager.RINGER_MODE_VIBRATE
                          hapticTap(context)
                      }
                      Mode.VIBRATE -> {
                          // Pixel-style MUTE: mute ring stream directly. No DND.
                          try {
                              audio.adjustStreamVolume(AudioManager.STREAM_RING, AudioManager.ADJUST_MUTE, 0)
                          } catch (_: Exception) {}
                          try {
                              audio.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_MUTE, 0)
                          } catch (_: Exception) {}
                          // Safety: if the system engaged DND anyway, shut it off
                          if (nm.currentInterruptionFilter != NotificationManager.INTERRUPTION_FILTER_ALL) {
                              nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL)
                          }
                      }
                      Mode.MUTE -> {
                          if (nm.currentInterruptionFilter != NotificationManager.INTERRUPTION_FILTER_ALL) {
                              nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL)
                          }
                          try {
                              audio.adjustStreamVolume(AudioManager.STREAM_RING, AudioManager.ADJUST_UNMUTE, 0)
                          } catch (_: Exception) {}
                          try {
                              audio.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_UNMUTE, 0)
                          } catch (_: Exception) {}
                          audio.ringerMode = AudioManager.RINGER_MODE_NORMAL
                      }
                  }
              }

              fun updateAllWidgets(context: Context) {
                  updateProvider(context, WidgetSquare::class.java, R.layout.widget_square,
                      R.drawable.bg_ring, R.drawable.bg_vibrate, R.drawable.bg_silent)
                  updateProvider(context, WidgetPill::class.java, R.layout.widget_pill,
                      R.drawable.bg_ring_pill, R.drawable.bg_vibrate_pill, R.drawable.bg_silent_pill)
                  updateProvider(context, WidgetCircle::class.java, R.layout.widget_circle,
                      R.drawable.bg_ring_circle, R.drawable.bg_vibrate_circle, R.drawable.bg_silent_circle)
              }

              private fun updateProvider(
                  context: Context, cls: Class<*>, layoutId: Int,
                  bgRing: Int, bgVibrate: Int, bgMute: Int
              ) {
                  val manager = AppWidgetManager.getInstance(context)
                  val ids = manager.getAppWidgetIds(ComponentName(context, cls))
                  if (ids.isEmpty()) return
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

                  for (id in ids) {
                      val views = RemoteViews(context.packageName, layoutId)
                      when (currentMode(context)) {
                          Mode.RING -> {
                              views.setInt(R.id.widget_card, "setBackgroundResource", bgRing)
                              views.setImageViewResource(R.id.widget_icon, R.drawable.ic_bell)
                              views.setContentDescription(R.id.widget_card, context.getString(R.string.mode_ring))
                          }
                          Mode.VIBRATE -> {
                              views.setInt(R.id.widget_card, "setBackgroundResource", bgVibrate)
                              views.setImageViewResource(R.id.widget_icon, R.drawable.ic_vibrate)
                              views.setContentDescription(R.id.widget_card, context.getString(R.string.mode_vibrate))
                          }
                          Mode.MUTE -> {
                              views.setInt(R.id.widget_card, "setBackgroundResource", bgMute)
                              views.setImageViewResource(R.id.widget_icon, R.drawable.ic_bell_off)
                              views.setContentDescription(R.id.widget_card, context.getString(R.string.mode_mute))
                          }
                      }

                      val pending: PendingIntent = if (nm.isNotificationPolicyAccessGranted) {
                          val intent = Intent(context, cls).apply { action = ACTION_TOGGLE }
                          PendingIntent.getBroadcast(context, 0, intent,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      } else {
                          PendingIntent.getActivity(context, 1, Intent(context, MainActivity::class.java),
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      }
                      views.setOnClickPendingIntent(R.id.widget_card, pending)
                      manager.updateAppWidget(id, views)
                  }
              }

              fun hapticTap(context: Context) {
                  val vibrator: Vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      val vm = context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                      vm.defaultVibrator
                  } else {
                      @Suppress("DEPRECATION")
                      context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  }
                  vibrator.vibrate(VibrationEffect.createOneShot(60, VibrationEffect.DEFAULT_AMPLITUDE))
              }
          }
          FILE_EOF_MARKER
          mkdir -p 'app/src/main/java/com/anoop/ringerwidget'
          cat > 'app/src/main/java/com/anoop/ringerwidget/RingerWidgetProvider.kt' << 'FILE_EOF_MARKER'
          package com.anoop.ringerwidget

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager

          abstract class BaseRingerWidget : AppWidgetProvider() {

              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  val style = WidgetCore.STYLES[this::class.java] ?: return
                  for (id in ids) WidgetCore.update(context, manager, id, this::class.java, style)
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  when (intent.action) {
                      WidgetCore.ACTION_TOGGLE -> {
                          WidgetCore.cycleMode(context)
                          WidgetCore.updateAll(context)
                      }
                      AudioManager.RINGER_MODE_CHANGED_ACTION,
                      Intent.ACTION_SCREEN_ON,
                      Intent.ACTION_USER_PRESENT -> WidgetCore.updateAll(context)
                  }
              }
          }

          class RingerWidgetProvider : BaseRingerWidget()
          class RingerWidgetCircleProvider : BaseRingerWidget()
          class RingerWidgetPillProvider : BaseRingerWidget()
          FILE_EOF_MARKER
          mkdir -p 'app/src/main/java/com/anoop/ringerwidget'
          cat > 'app/src/main/java/com/anoop/ringerwidget/WidgetCore.kt' << 'FILE_EOF_MARKER'
          package com.anoop.ringerwidget

          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.widget.RemoteViews

          /** Shared logic for all widget styles. */
          object WidgetCore {

              const val ACTION_TOGGLE = "com.anoop.ringerwidget.TOGGLE"

              data class Style(
                  val layout: Int,
                  val bgRing: Int,
                  val bgVibrate: Int,
                  val bgSilent: Int
              )

              val STYLES: Map<Class<*>, Style> = mapOf(
                  RingerWidgetProvider::class.java to Style(
                      R.layout.widget_ringer, R.drawable.bg_ring, R.drawable.bg_vibrate, R.drawable.bg_silent
                  ),
                  RingerWidgetCircleProvider::class.java to Style(
                      R.layout.widget_circle, R.drawable.bg_ring_oval, R.drawable.bg_vibrate_oval, R.drawable.bg_silent_oval
                  ),
                  RingerWidgetPillProvider::class.java to Style(
                      R.layout.widget_pill, R.drawable.bg_ring_pill, R.drawable.bg_vibrate_pill, R.drawable.bg_silent_pill
                  )
              )

              fun updateAll(context: Context) {
                  val manager = AppWidgetManager.getInstance(context)
                  for ((cls, style) in STYLES) {
                      val ids = manager.getAppWidgetIds(ComponentName(context, cls))
                      for (id in ids) update(context, manager, id, cls, style)
                  }
              }

              fun update(context: Context, manager: AppWidgetManager, widgetId: Int, cls: Class<*>, style: Style) {
                  val audio = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val views = RemoteViews(context.packageName, style.layout)

                  when (audio.ringerMode) {
                      AudioManager.RINGER_MODE_NORMAL -> {
                          views.setInt(R.id.widget_card, "setBackgroundResource", style.bgRing)
                          views.setImageViewResource(R.id.widget_icon, R.drawable.ic_bell)
                          views.setContentDescription(R.id.widget_card, context.getString(R.string.mode_ring))
                      }
                      AudioManager.RINGER_MODE_VIBRATE -> {
                          views.setInt(R.id.widget_card, "setBackgroundResource", style.bgVibrate)
                          views.setImageViewResource(R.id.widget_icon, R.drawable.ic_vibrate)
                          views.setContentDescription(R.id.widget_card, context.getString(R.string.mode_vibrate))
                      }
                      else -> {
                          views.setInt(R.id.widget_card, "setBackgroundResource", style.bgSilent)
                          views.setImageViewResource(R.id.widget_icon, R.drawable.ic_bell_off)
                          views.setContentDescription(R.id.widget_card, context.getString(R.string.mode_mute))
                      }
                  }

                  val pending: PendingIntent = if (nm.isNotificationPolicyAccessGranted) {
                      @Suppress("UNCHECKED_CAST")
                      val intent = Intent(context, cls as Class<Any>).apply { action = ACTION_TOGGLE }
                      PendingIntent.getBroadcast(
                          context, cls.hashCode(), intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                  } else {
                      PendingIntent.getActivity(
                          context, 1, Intent(context, MainActivity::class.java),
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                  }
                  views.setOnClickPendingIntent(R.id.widget_card, pending)
                  manager.updateAppWidget(widgetId, views)
              }

              /**
               * Ring -> Vibrate -> Mute -> Ring.
               * MUTE uses the same internal path as the volume keys (stream mute),
               * which silences the phone WITHOUT triggering Do Not Disturb.
               */
              fun cycleMode(context: Context) {
                  val audio = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (!nm.isNotificationPolicyAccessGranted) return

                  when (audio.ringerMode) {
                      AudioManager.RINGER_MODE_NORMAL -> {
                          audio.ringerMode = AudioManager.RINGER_MODE_VIBRATE
                          hapticTap(context)
                      }
                      AudioManager.RINGER_MODE_VIBRATE -> {
                          // Volume-key style mute: mute the ring stream directly. No DND.
                          audio.adjustStreamVolume(AudioManager.STREAM_RING, AudioManager.ADJUST_MUTE, 0)
                          // Safety: if the system coupled DND anyway, immediately clear it
                          if (nm.currentInterruptionFilter != NotificationManager.INTERRUPTION_FILTER_ALL) {
                              nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL)
                          }
                      }
                      else -> {
                          // Make sure DND is off, unmute ring stream, back to Ring
                          if (nm.currentInterruptionFilter != NotificationManager.INTERRUPTION_FILTER_ALL) {
                              nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL)
                          }
                          audio.adjustStreamVolume(AudioManager.STREAM_RING, AudioManager.ADJUST_UNMUTE, 0)
                          audio.ringerMode = AudioManager.RINGER_MODE_NORMAL
                      }
                  }
              }

              private fun hapticTap(context: Context) {
                  val vibrator: Vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      val vm = context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                      vm.defaultVibrator
                  } else {
                      @Suppress("DEPRECATION")
                      context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  }
                  vibrator.vibrate(VibrationEffect.createOneShot(60, VibrationEffect.DEFAULT_AMPLITUDE))
              }
          }
          FILE_EOF_MARKER
