name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project files
        run: |
          set -e
          mkdir -p project
          cd project
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' << 'FILE_EOF_MARKER'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.anoop.ringerwidget"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.anoop.ringerwidget"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          FILE_EOF_MARKER
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' << 'FILE_EOF_MARKER'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />

              <application
                  android:name=".RingerApp"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.RingerWidget"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".RingerWidgetProvider"
                      android:exported="true"
                      android:label="@string/widget_label">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.anoop.ringerwidget.TOGGLE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/ringer_widget_info" />
                  </receiver>

              </application>
          </manifest>
          FILE_EOF_MARKER
          mkdir -p 'app/src/main/java/com/anoop/ringerwidget'
          cat > 'app/src/main/java/com/anoop/ringerwidget/MainActivity.kt' << 'FILE_EOF_MARKER'
          package com.anoop.ringerwidget

          import android.app.NotificationManager
          import android.content.Intent
          import android.media.AudioManager
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var statusText: TextView
              private lateinit var toggleButton: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  statusText = findViewById(R.id.status_text)
                  toggleButton = findViewById(R.id.toggle_button)

                  toggleButton.setOnClickListener {
                      val nm = getSystemService(NotificationManager::class.java)
                      if (!nm.isNotificationPolicyAccessGranted) {
                          startActivity(Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS))
                      } else {
                          RingerWidgetProvider.cycleMode(this)
                          refresh()
                          RingerWidgetProvider.updateAllWidgets(this)
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
                  RingerWidgetProvider.updateAllWidgets(this)
              }

              private fun refresh() {
                  val nm = getSystemService(NotificationManager::class.java)
                  if (!nm.isNotificationPolicyAccessGranted) {
                      statusText.text = getString(R.string.perm_needed)
                      toggleButton.text = getString(R.string.btn_grant)
                      return
                  }
                  val audio = getSystemService(AUDIO_SERVICE) as AudioManager
                  statusText.text = when (audio.ringerMode) {
                      AudioManager.RINGER_MODE_NORMAL -> getString(R.string.status_ring)
                      AudioManager.RINGER_MODE_VIBRATE -> getString(R.string.status_vibrate)
                      else -> getString(R.string.status_mute)
                  }
                  toggleButton.text = getString(R.string.btn_cycle)
              }
          }
          FILE_EOF_MARKER
          mkdir -p 'app/src/main/java/com/anoop/ringerwidget'
          cat > 'app/src/main/java/com/anoop/ringerwidget/RingerApp.kt' << 'FILE_EOF_MARKER'
          package com.anoop.ringerwidget

          import android.app.Application
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.media.AudioManager
          import androidx.core.content.ContextCompat

          class RingerApp : Application() {

              private val syncReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      RingerWidgetProvider.updateAllWidgets(context)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  val filter = IntentFilter().apply {
                      addAction(AudioManager.RINGER_MODE_CHANGED_ACTION)
                      addAction(Intent.ACTION_SCREEN_ON)
                      addAction(Intent.ACTION_USER_PRESENT)
                  }
                  ContextCompat.registerReceiver(this, syncReceiver, filter, ContextCompat.RECEIVER_EXPORTED)
                  RingerWidgetProvider.updateAllWidgets(this)
              }
          }
          FILE_EOF_MARKER
          mkdir -p 'app/src/main/java/com/anoop/ringerwidget'
          cat > 'app/src/main/java/com/anoop/ringerwidget/RingerWidgetProvider.kt' << 'FILE_EOF_MARKER'
          package com.anoop.ringerwidget

          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.widget.RemoteViews

          class RingerWidgetProvider : AppWidgetProvider() {

              companion object {
                  const val ACTION_TOGGLE = "com.anoop.ringerwidget.TOGGLE"

                  fun updateAllWidgets(context: Context) {
                      val manager = AppWidgetManager.getInstance(context)
                      val ids = manager.getAppWidgetIds(
                          ComponentName(context, RingerWidgetProvider::class.java)
                      )
                      for (id in ids) updateWidget(context, manager, id)
                  }

                  fun updateWidget(context: Context, manager: AppWidgetManager, widgetId: Int) {
                      val audio = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val views = RemoteViews(context.packageName, R.layout.widget_ringer)

                      when (audio.ringerMode) {
                          AudioManager.RINGER_MODE_NORMAL -> {
                              views.setInt(R.id.widget_card, "setBackgroundResource", R.drawable.bg_ring)
                              views.setImageViewResource(R.id.widget_icon, R.drawable.ic_bell)
                              views.setContentDescription(R.id.widget_card, context.getString(R.string.mode_ring))
                          }
                          AudioManager.RINGER_MODE_VIBRATE -> {
                              views.setInt(R.id.widget_card, "setBackgroundResource", R.drawable.bg_vibrate)
                              views.setImageViewResource(R.id.widget_icon, R.drawable.ic_vibrate)
                              views.setContentDescription(R.id.widget_card, context.getString(R.string.mode_vibrate))
                          }
                          else -> {
                              views.setInt(R.id.widget_card, "setBackgroundResource", R.drawable.bg_silent)
                              views.setImageViewResource(R.id.widget_icon, R.drawable.ic_bell_off)
                              views.setContentDescription(R.id.widget_card, context.getString(R.string.mode_mute))
                          }
                      }

                      val pending: PendingIntent = if (nm.isNotificationPolicyAccessGranted) {
                          val intent = Intent(context, RingerWidgetProvider::class.java).apply {
                              action = ACTION_TOGGLE
                          }
                          PendingIntent.getBroadcast(
                              context, 0, intent,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                      } else {
                          val intent = Intent(context, MainActivity::class.java)
                          PendingIntent.getActivity(
                              context, 1, intent,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                      }
                      views.setOnClickPendingIntent(R.id.widget_card, pending)
                      manager.updateAppWidget(widgetId, views)
                  }

                  fun cycleMode(context: Context) {
                      val audio = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (!nm.isNotificationPolicyAccessGranted) return

                      when (audio.ringerMode) {
                          AudioManager.RINGER_MODE_NORMAL -> {
                              audio.ringerMode = AudioManager.RINGER_MODE_VIBRATE
                              hapticTap(context)
                          }
                          AudioManager.RINGER_MODE_VIBRATE -> {
                              audio.ringerMode = AudioManager.RINGER_MODE_SILENT
                              if (nm.currentInterruptionFilter != NotificationManager.INTERRUPTION_FILTER_ALL) {
                                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL)
                              }
                              if (audio.ringerMode != AudioManager.RINGER_MODE_SILENT) {
                                  audio.ringerMode = AudioManager.RINGER_MODE_SILENT
                              }
                          }
                          else -> {
                              if (nm.currentInterruptionFilter != NotificationManager.INTERRUPTION_FILTER_ALL) {
                                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL)
                              }
                              audio.ringerMode = AudioManager.RINGER_MODE_NORMAL
                          }
                      }
                  }

                  private fun hapticTap(context: Context) {
                      val vibrator: Vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          val vm = context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                          vm.defaultVibrator
                      } else {
                          @Suppress("DEPRECATION")
                          context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      }
                      vibrator.vibrate(VibrationEffect.createOneShot(60, VibrationEffect.DEFAULT_AMPLITUDE))
                  }
              }

              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  for (id in ids) updateWidget(context, manager, id)
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  when (intent.action) {
                      ACTION_TOGGLE -> {
                          cycleMode(context)
                          updateAllWidgets(context)
                      }
                      AudioManager.RINGER_MODE_CHANGED_ACTION,
                      Intent.ACTION_SCREEN_ON,
                      Intent.ACTION_USER_PRESENT -> {
                          updateAllWidgets(context)
                      }
                  }
              }
          }
          FILE_EOF_MARKER
